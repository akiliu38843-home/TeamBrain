# issue #155 Order 5: per-PR install verification (V1-V4)
#
# Tests the shell entry points (release/install.sh + scripts/bootstrap.sh) for
# manifest sync (V2), idempotent re-run (V3), and timing budget (V4). V1 (1-prompt
# under Claude Code strict permission mode) cannot be tested in CI without a
# Claude Code container; that part is human-gated and verified at /review time.
#
# Triggers:
#   - pull_request    (the V2/V3/V4 sub-tests are fast + dependency-free)
#   - workflow_dispatch (manual debugging)
#
# Ships ENABLED in this PR because orders 1+3 land in the same PR (the deps
# this workflow tests are present from PR-merge time).

name: install-verify (V1-V4)

on:
  pull_request:
    paths:
      - "release/install.sh"
      - "scripts/bootstrap.sh"
      - "scripts/check-manifest-sync.sh"
      - "docs/install-manifest.txt"
      - ".github/workflows/install-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-sync:
    name: V2 — manifest byte-identical (install.sh embed == docs/install-manifest.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run manifest sync check
        run: bash scripts/check-manifest-sync.sh

  preview-flag-smoke:
    name: V2 — --preview prints 5 section markers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --preview emits 5 sections
        run: |
          out=$(bash release/install.sh --preview)
          for section in "[config]" "[skills]" "[kb]" "[download]" "[refusal]"; do
            if ! grep -qF "$section" <<<"$out"; then
              echo "FAIL: install.sh --preview missing section $section" >&2
              echo "$out" >&2
              exit 1
            fi
          done
          echo "OK: install.sh --preview emits all 5 sections"
      - name: bootstrap.sh --preview emits 5 sections
        run: |
          out=$(bash scripts/bootstrap.sh --preview)
          for section in "[config]" "[skills]" "[kb]" "[download]" "[refusal]"; do
            if ! grep -qF "$section" <<<"$out"; then
              echo "FAIL: bootstrap.sh --preview missing section $section" >&2
              echo "$out" >&2
              exit 1
            fi
          done
          echo "OK: bootstrap.sh --preview emits all 5 sections"

  idempotent-rerun:
    name: V3 — running --preview twice gives identical output (idempotency smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: --preview output stable across reruns
        run: |
          run1=$(bash release/install.sh --preview)
          run2=$(bash release/install.sh --preview)
          if [ "$run1" != "$run2" ]; then
            echo "FAIL: install.sh --preview is not idempotent across reruns" >&2
            diff <(echo "$run1") <(echo "$run2") >&2
            exit 1
          fi
          echo "OK: install.sh --preview is idempotent"
      - name: --help is also idempotent
        run: |
          run1=$(bash release/install.sh --help)
          run2=$(bash release/install.sh --help)
          [ "$run1" = "$run2" ] || { echo "install.sh --help drifted across runs"; exit 1; }

  timing-budget:
    name: V4 — --preview wall time under budget (≤ 2s)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Time install.sh --preview
        run: |
          start=$(date +%s%N)
          bash release/install.sh --preview > /dev/null
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          echo "install.sh --preview elapsed: ${elapsed_ms}ms"
          if [ "$elapsed_ms" -gt 2000 ]; then
            echo "FAIL: install.sh --preview took ${elapsed_ms}ms; budget is 2000ms" >&2
            exit 1
          fi

# Anti-goals (per Order 5 plan):
# - Does NOT install teamagent or download tarballs (would consume CI minutes
#   and require network reliability we don't depend on for smoke tests)
# - Does NOT test V1 (Claude Code strict permission mode; not reproducible in CI;
#   human-gated at /review time)
# - Does NOT consume API quota (no claudefast probes; that's Order 6's job)
